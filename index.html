<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f0e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Alaska Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Google Identity Services — handles token refresh silently after initial sign-in -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0d0f0e; }
    body { overscroll-behavior: none; }

    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="date"] {
      width: 100%;
      padding: 14px;
      background: #1e2220;
      border: 1px solid #3a4240;
      color: #c8d0c8;
      border-radius: 8px;
      font-family: 'Barlow Condensed', system-ui, sans-serif;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus { outline: 2px solid #e8a020; border-color: transparent; }
    input[type="number"] { font-family: 'Courier New', monospace; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.5); }
    h2 {
      font-size: 13px !important;
      letter-spacing: 0.1em;
      color: #7a8a80;
      margin-bottom: 20px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
  <script>
  (async function () {

    // ── IndexedDB key/value store ──────────────────────────────────────────

    const IDB_NAME  = 'alaska-tracker';
    const IDB_STORE = 'kv';
    let _db = null;

    function openDB() {
      if (_db) return Promise.resolve(_db);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        req.onsuccess  = e => { _db = e.target.result; resolve(_db); };
        req.onerror    = e => reject(e.target.error);
      });
    }

    async function idbGet(key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result ?? null);
        req.onerror   = () => reject(req.error);
      });
    }

    async function idbSet(key, value) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
      });
    }

    async function idbDel(...keys) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        keys.forEach(k => tx.objectStore(IDB_STORE).delete(k));
        tx.oncomplete = () => resolve();
        tx.onerror    = () => reject(tx.error);
      });
    }

    // ── One-time migration: localStorage → IndexedDB ──────────────────────
    // Runs once if IDB is empty but localStorage still has values from the old build.
    const APP_KEYS = ['oauth_token','sheet_id','google_client_id','anthropic_key','trip_start','trips','active_trip'];
    const hasMigrated = await idbGet('_migrated');
    if (!hasMigrated) {
      for (const k of APP_KEYS) {
        const v = localStorage.getItem(k);
        if (v) await idbSet(k, v);
      }
      await idbSet('_migrated', '1');
    }

    // ── Load all persisted settings before starting Elm ───────────────────

    const stored   = await Promise.all(APP_KEYS.map(idbGet));
    const [token, sheetId, googleClientId, anthropicKey, tripStart, tripsJson, activeTripTab] = stored;

    const flags = {
      token:          token || null,
      sheetId:        sheetId        || '',
      googleClientId: googleClientId || '',
      anthropicKey:   anthropicKey   || '',
      trips:          tripsJson      || '',
      activeTripTab:  activeTripTab  || '',
      today:          new Date().toISOString().slice(0, 10),
      version:        '39ff561cbe69625e532145fef196231a6baf46fc',
    };

    // ── <map-picker> custom element ────────────────────────────────────────
    class MapPicker extends HTMLElement {
      connectedCallback() {
        this._overlay = document.createElement('div');
        Object.assign(this._overlay.style, {
          position: 'fixed', inset: '0', background: 'rgba(0,0,0,0.85)',
          zIndex: '9999', display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center',
        });

        const mapDiv = document.createElement('div');
        Object.assign(mapDiv.style, {
          width: 'min(460px,96vw)', height: '360px',
          borderRadius: '12px', overflow: 'hidden',
        });

        const toolbar = document.createElement('div');
        Object.assign(toolbar.style, {
          display: 'flex', gap: '12px', marginTop: '16px', width: 'min(460px,96vw)',
        });

        const confirmBtn = document.createElement('button');
        confirmBtn.textContent = 'Confirm location';
        Object.assign(confirmBtn.style, {
          flex: '1', background: '#e8a020', color: '#0d0f0e', border: 'none',
          borderRadius: '8px', padding: '14px', fontSize: '16px',
          fontWeight: '700', cursor: 'pointer', fontFamily: 'inherit',
        });

        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'Cancel';
        Object.assign(cancelBtn.style, {
          background: 'none', border: '1px solid #3a4240', color: '#7a8a80',
          borderRadius: '8px', padding: '14px 20px', fontSize: '14px',
          cursor: 'pointer', fontFamily: 'inherit',
        });

        toolbar.append(confirmBtn, cancelBtn);
        this._overlay.append(mapDiv, toolbar);
        document.body.appendChild(this._overlay);

        const lat = parseFloat(this.getAttribute('lat') || '64.2008');
        const lon = parseFloat(this.getAttribute('lon') || '-153.4937');

        this._map = L.map(mapDiv).setView([lat, lon], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 19,
        }).addTo(this._map);
        this._marker = L.marker([lat, lon], { draggable: true }).addTo(this._map);

        // Leaflet needs visible container before sizing correctly
        setTimeout(() => this._map && this._map.invalidateSize(), 100);

        confirmBtn.addEventListener('click', () => {
          const { lat: la, lng: lo } = this._marker.getLatLng();
          this.dispatchEvent(new CustomEvent('confirm', { detail: { lat: la, lon: lo }, bubbles: true }));
        });

        cancelBtn.addEventListener('click', () => {
          this.dispatchEvent(new CustomEvent('dismiss', { bubbles: true }));
        });
      }

      disconnectedCallback() {
        if (this._map) { this._map.remove(); this._map = null; }
        if (this._overlay) { this._overlay.remove(); this._overlay = null; }
      }

      attributeChangedCallback(name, _old, val) {
        if (!this._map || !this._marker) return;
        if (name === 'lat' || name === 'lon') {
          const la = parseFloat(this.getAttribute('lat') || '64.2008');
          const lo = parseFloat(this.getAttribute('lon') || '-153.4937');
          this._map.setView([la, lo]);
          this._marker.setLatLng([la, lo]);
        }
      }

      static get observedAttributes() { return ['lat', 'lon']; }
    }

    customElements.define('map-picker', MapPicker);

    // ── <waypoint-map> custom element ──────────────────────────────────────
    class WaypointMap extends HTMLElement {
      connectedCallback() {
        this._map = L.map(this).setView([64.2008, -153.4937], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
          maxZoom: 19,
        }).addTo(this._map);
        this._markers = [];
        this._renderPoints(this.getAttribute('points'));
        setTimeout(() => this._map && this._map.invalidateSize(), 100);
      }

      disconnectedCallback() {
        if (this._map) { this._map.remove(); this._map = null; }
        this._markers = [];
      }

      _renderPoints(raw) {
        this._markers.forEach(m => m.remove());
        this._markers = [];
        let pts; try { pts = JSON.parse(raw || '[]'); } catch (_) { return; }
        if (!pts.length) return;
        const lls = [];
        pts.forEach(p => {
          const m = L.marker([p.lat, p.lon]).addTo(this._map);
          if (p.label) m.bindPopup(p.label);
          this._markers.push(m);
          lls.push([p.lat, p.lon]);
        });
        if (lls.length === 1) this._map.setView(lls[0], 13);
        else this._map.fitBounds(lls, { padding: [20, 20] });
      }

      attributeChangedCallback(name, _old, val) {
        if (name === 'points' && this._map) this._renderPoints(val);
      }

      static get observedAttributes() { return ['points']; }
    }

    customElements.define('waypoint-map', WaypointMap);

    // ── Start Elm ──────────────────────────────────────────────────────────

    const app = Elm.Main.init({ node: document.getElementById('app'), flags });

    // ── Google Identity Services token client ──────────────────────────────
    //
    // GIS handles the full OAuth lifecycle:
    //   • First sign-in → shows Google account chooser popup
    //   • Subsequent calls (e.g. after a 401) → silent grant, no popup
    //   • No redirect needed; no server needed; no refresh-token needed.
    //   • Tokens last ~1 h; GIS silently renews them on demand.

    let tokenClient = null;

    function setupGoogleAuth(clientId) {
      if (!clientId) return;
      // GIS may still be loading; retry up to ~3 s
      if (!window.google?.accounts?.oauth2) {
        setTimeout(() => setupGoogleAuth(clientId), 300);
        return;
      }
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/spreadsheets',
        callback: async (resp) => {
          if (resp.error) { console.error('GIS error:', resp); return; }
          await idbSet('oauth_token', resp.access_token);
          app.ports.gotNewToken.send(resp.access_token);
        },
      });
    }

    // Init with whatever clientId we already have stored
    if (googleClientId) setupGoogleAuth(googleClientId);

    // ── Port handlers ──────────────────────────────────────────────────────

    // Save a value to IndexedDB; also re-init GIS if the client ID changed
    app.ports.saveStorage.subscribe(async ({ key, value }) => {
      await idbSet(key, value);
      if (key === 'google_client_id') setupGoogleAuth(value);
    });

    // Clear only the OAuth token on sign-out (config survives for next login)
    app.ports.clearStorage.subscribe(() => idbDel('oauth_token'));

    // Full wipe — triggered by "Reset all settings"
    app.ports.clearAllStorage.subscribe(() => idbDel(...APP_KEYS));

    // Request an OAuth token.
    // forcePrompt=true  → first sign-in (shows account chooser)
    // forcePrompt=false → silent re-auth after 401 (usually no popup)
    app.ports.requestOAuthToken.subscribe((forcePrompt) => {
      if (!tokenClient) {
        console.warn('GIS not ready — clientId missing?');
        return;
      }
      tokenClient.requestAccessToken(forcePrompt ? { prompt: 'consent' } : { prompt: '' });
    });

    // Geolocation
    app.ports.requestGeolocation.subscribe(() => {
      if (!('geolocation' in navigator)) {
        app.ports.gotGpsCoords.send({ lat: 0, lon: 0, denied: true });
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => app.ports.gotGpsCoords.send({ lat: pos.coords.latitude, lon: pos.coords.longitude, denied: false }),
        _err => app.ports.gotGpsCoords.send({ lat: 0, lon: 0, denied: true }),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
      );
    });

    // EXIF GPS extraction from image data URL
    app.ports.extractExifGps.subscribe(async ({ id, dataUrl }) => {
      try {
        // Convert data URL → ArrayBuffer so exifr gets raw bytes (required for HEIC)
        const res = await fetch(dataUrl);
        const buffer = await res.arrayBuffer();

        const exif = await exifr.parse(buffer, { gps: true, tiff: true, ifd0: true, exif: true });
        console.log('[exifr] parsed tags:', exif);

        const debug = JSON.stringify(exif ?? null, null, 2);

        if (exif && typeof exif.latitude === 'number' && typeof exif.longitude === 'number') {
          console.log('[exifr] GPS found:', exif.latitude, exif.longitude);
          app.ports.gotExifResult.send({ id, lat: exif.latitude, lon: exif.longitude, hasGps: true, debug: '' });
        } else {
          console.log('[exifr] no GPS in image');
          app.ports.gotExifResult.send({ id, lat: 0, lon: 0, hasGps: false, debug });
        }
      } catch (err) {
        console.error('[exifr] parse error:', err);
        app.ports.gotExifResult.send({ id, lat: 0, lon: 0, hasGps: false, debug: String(err) });
      }
    });

    // ── PWA service worker — unregister all SWs to avoid caching issues ──────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(regs => regs.forEach(r => r.unregister()));
    }

  })();
  </script>
</body>
</html>
