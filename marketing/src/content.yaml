meta:
  title: "Ternpike — Expense Tracker for Road Trips, Van Life & RVs"
  description: "Built for road trippers, van lifers, and overlanders. Scan receipts, log GPS, share a ledger with your crew. Works offline. Free, with a lifetime tier."
  lang: "en"

brand:
  name: "Ternpike"
  namePrefix: "Tern"
  nameSuffix: "pike"
  tagline: "Track every turn of the road."

nav:
  links:
    - label: "How it works"
      href: "/#how"
    - label: "Pricing"
      href: "/#pricing"
  cta:
    label: "Get Started"
    href: "/#signup"

hero:
  headline: "Expense tracking for road trips, van life, and the long way home."
  subheadline: "Orlando to Juneau. Every dollar accounted for."
  sub:
    - "Ternpike is the offline-first trip expense tracker built for life on the road. Snap a receipt, log your location, see exactly what each day costs. Built on the Alaska Highway, used in the real world."
  actions:
    - kind: "primary"
      label: "Start for free"
      arrow: true
      href: "#signup"
    - kind: "ghost"
      label: "Try the live demo"
      arrow: true
      href: "https://app.ternpike.com/demo"
    - kind: "ghost"
      label: "See how it works"
      href: "#how"
  proof: "Built on the Alaska Highway. Used in the real world."

howItWorks:
  eyebrow: "How it works"
  seoHeadline: "How Ternpike tracks road trip expenses"
  headlineHtml: "Three steps.<br>Then get some sleep."
  steps:
    - number: "01"
      icon: "📸"
      iconName: "camera"
      title: "Snap your receipts"
      body: "Photograph one receipt or a stack at the end of the day. Ternpike reads them and pulls out the amount, merchant, category, and a note. No signal? Just type it in. Nothing gets lost."
    - number: "02"
      icon: "📍"
      iconName: "map-pin"
      title: "Log your location"
      body: "Every expense gets a GPS pin. Your route builds itself as you go."
    - number: "03"
      icon: "✅"
      iconName: "check"
      title: "See the full picture"
      body: "Open the ledger. See what you've spent by day and by category. Know your daily average before you decide whether to splurge on a cabin or sleep in the truck."

ocrDemo:
  eyebrow: "Try it"
  seoHeadline: "Try receipt scanning right here"
  headlineHtml: "Drop a receipt.<br>We'll mail it back, read."
  body: "Drop a photo, leave your email, and we'll send you back exactly what Ternpike extracted from it. Three on us, no sign-up."
  dropPrompt: "Choose a receipt"
  dropHint: "JPEG / PNG / HEIC, up to ~8 MB"
  emailLabel: "Where do we send it?"
  emailPlaceholder: "your@email.com"
  cta: "Send me the result"
  busy: "Reading the receipt…"
  retry: "Scan another"
  idle: "What you'll get"
  steps:
    - "We read the receipt with the same OCR that runs in the app."
    - "You get an email with amount, merchant, date, category, payment, and a short note."
    - "Plus a one-time discount code if you want to keep going."
  sentTitle: "Receipt's on its way."
  sentBody: "Look for it at"
  errors:
    invalidEmail: "That email doesn't look right — give it another shot?"
    rateLimit: "You've used today's free scans. Sign up to keep scanning."
    noReceipt: "Couldn't read a receipt from that image. Try a clearer photo."
    tooLarge: "That image is too large. Try a smaller photo."
    emailDelivery: "We read the receipt but couldn't send the email. Try again?"
    generic: "Something went wrong — try again?"

features:
  eyebrow: "Features"
  seoHeadline: "Built for offline travel expense tracking"
  headlineHtml: "Built for the realities<br>of remote travel."
  items:
    - icon: "📶"
      iconName: "wifi-off"
      title: "Works without signal"
      body: "Log expenses anywhere. Everything syncs when you're back online."
    - icon: "🧾"
      iconName: "receipt"
      title: "Receipt scanning"
      body: "Point your camera at a receipt and Ternpike fills in the details. Review and confirm. Move on."
    - icon: "🗺️"
      iconName: "map"
      title: "GPS trail"
      body: "Every expense with a location plots on a live map. A record of everywhere you stopped and everything you spent."
    - icon: "📄"
      iconName: "file-export"
      title: "Your data"
      body: "Your expenses live in your account. Export to CSV anytime."
    - icon: "👥"
      iconName: "users"
      title: "Nest. Shared ledger."
      body: "Add your partner, family, or travel crew. Everyone logs to the same trip. One budget, multiple contributors."
    - icon: "📊"
      iconName: "chart-bar"
      title: "Stats that matter"
      body: "Daily average. Top category. Projected total. The things you actually want to know when you're deciding where to camp tonight."

ledgerPreview:
  sectionLabel: "The ledger"
  seoHeadline: "The road trip ledger"
  headline: "Looks like a journal.\nWorks like a spreadsheet."
  caption: "Every expense logged, categorized, and mapped. Grouped by day so the story of your trip reads like a trip, not an accounting report."
  totalLabel: "Running total"
  totalAmount: "$39989.00"
  totalMeta: "744 entries · 181 days"
  ledgerSample:
    - day: 181
      date: "May 21, 2026"
      entries:
        - merchant: "ice cream"
          category: "food"
          amount: "$2.00"
          hasGps: true
        - merchant: "Centolla King Crab Shack"
          category: "food"
          amount: "$48.00"
          hasGps: true
    - day: 180
      date: "May 20, 2026"
      entries:
        - merchant: "Aerolíneas Argentinas USH → EZE → LAX"
          category: "transport"
          amount: "$1850.00"
          hasGps: true
        - merchant: "La Anónima Supermarket"
          category: "food"
          amount: "$36.40"
          hasGps: true
    - day: 179
      date: "May 19, 2026"
      entries:
        - merchant: "Hostería Tierra del Fuego"
          category: "lodging"
          amount: "$92.00"
          hasGps: true
        - merchant: "YPF Ruta 3 Sur"
          category: "fuel"
          amount: "$64.10"
          hasGps: true
        - merchant: "Parque Nacional entry"
          category: "activities"
          amount: "$18.00"
          hasGps: false

pricing:
  sectionLabel: "Pricing"
  seoHeadline: "Pricing for every kind of road tripper"
  headline: "Simple.\nNo surprises."
  finePrint: "Tern is genuinely free, forever. No trials that flip to paid."
  tiers:
    - id: "fledgling"
      name: "Tern"
      tagline: "For casual loggers."
      price: "$0"
      priceNote: "always free"
      featured: false
      features:
        - "Offline expense log"
        - "Unlimited trips"
        - "5 receipt scans / month"
        - "Amount and category only"
        - "No account required"
      cta:
        label: "Download free"
        href: "#signup"
        style: "ghost"
        arrow: false
    - id: "fly"
      name: "Osprey"
      tagline: "For the dedicated road tripper."
      price: "$2.99 / month"
      priceNote: "$24 / year. Save $12."
      featured: true
      badge: "Recommended"
      features:
        - "Everything in Tern"
        - "Unlimited receipt scanning"
        - "Full receipt details (merchant, date, notes, GPS)"
        - "Cross-device sync"
        - "Nest. Shared ledger for couples and travel groups."
        - "Stats dashboard"
        - "CSV export"
      cta:
        label: "Start flying"
        href: "#signup"
        style: "primary"
        arrow: true
    - id: "trailblazer"
      name: "Trailblazer"
      tagline: "Own it forever. First 500 only."
      price: "$79"
      priceNote: "one time"
      featured: false
      features:
        - "Everything in Osprey"
        - "No recurring charge, ever"
        - "All 1.x updates included"
        - "Loyalty discount on v2"
        - "Your name in the credits"
      cta:
        label: "Claim your spot"
        href: "#signup"
        style: "ghost"
        arrow: false

origin:
  eyebrow: "Why we built it"
  headline: "I built Ternpike because I was driving to Alaska and couldn't stop doing math in my head."
  paragraphs:
    - "How much have I spent? How much is left? Is this sustainable or just a thing I did once?"
    - "Snap a receipt, see the number, stop worrying about it. That's what it does."
    - "By the end of the trip I had the real cost. Not a guess. Gas, camps, food, the whole thing. Enough to know what the trip actually takes and whether I could do it again."
    - "I could. Now I know."
  attribution: "— Dwight"

comparison:
  eyebrow: "Why Ternpike"
  seoHeadline: "Why choose Ternpike over other travel expense apps"
  headline: "The only app that does all four."
  columns:
