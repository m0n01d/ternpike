meta:
  title: "Ternpike — Track Every Turn of the Road"
  description: "Snap a photo of your receipt at camp. Ternpike reads it, logs your GPS, and shows exactly where your budget stands before you pull out tomorrow morning."
  lang: "en"

brand:
  name: "Ternpike"
  namePrefix: "Tern"
  nameSuffix: "pike"
  tagline: "Track every turn of the road."

nav:
  links:
    - label: "How it works"
      href: "#how"
    - label: "Features"
      href: "#features"
    - label: "Open Source"
      href: "#oss"
  cta:
    label: "Get Early Access"
    href: "#signup"

hero:
  eyebrow: "Road Trip Expense Tracker"
  headline:
    prefix: "Tern"
    suffix: "pike"
  sub: "Snap a photo of your receipt at camp. We read it, log your GPS, and show exactly where your budget stands before you pull out tomorrow morning."
  actions:
    - kind: "primary"
      label: "Get Early Access →"
      href: "#signup"
    - kind: "ghost"
      label: "See How It Works"
      href: "#how"
  proof: "Built on the Alaska Highway · Zero subscription · Your data, your Google Sheet"

howItWorks:
  eyebrow: "How It Works"
  headlineHtml: "Three steps.<br>Then go to sleep."
  steps:
    - number: "01"
      icon: "📸"
      title: "Snap your receipts"
      body: "Photograph one or a stack at the end of a long driving day. Queue them all at once — Ternpike processes in parallel."
    - number: "02"
      icon: "🤖"
      title: "AI reads them"
      body: "Claude extracts the amount, merchant, date, and category. Writes a short note and a detailed one. You review and confirm — or edit anything."
    - number: "03"
      icon: "📍"
      title: "Logged with GPS"
      body: "Every entry gets coordinates — from the photo EXIF, your browser, or a map pin you drop. Your spending trail plots on a map of the whole route."

features:
  eyebrow: "Features"
  headlineHtml: "Built for<br>the realities of remote travel."
  items:
    - icon: "📶"
      title: "Works offline"
      body: "Installable PWA. Queue receipts in the backcountry, sync when you hit signal. Cached data always viewable."
    - icon: "🗺️"
      title: "Waypoint map"
      body: "Every expense with coordinates plots on a live map. Your financial trail and your geographic trail in one view."
    - icon: "📊"
      title: "Live stats dashboard"
      body: "10 live metrics. Daily spending chart. Category breakdown. Cumulative spend curve. Know your burn rate at a glance."
    - icon: "🔒"
      title: "Your data, your sheet"
      body: "One Google Sheet is the entire database. You own it. Export to CSV, run formulas, connect to Looker Studio. We're a UI layer, not a data silo."
    - icon: "⚡"
      title: "No account required"
      body: "Google sign-in only — no passwords, no new accounts. Works without an API key too: photos queue for manual entry."
    - icon: "🏕️"
      title: "11 road-trip categories"
      body: "Fuel · Food · Camp · Ferry · Gear · Lodging · Activities · Shopping · Medical · Transport · Misc. Broad enough for months, specific enough to be useful."

ledgerPreview:
  eyebrow: "The Ledger"
  headlineHtml: "Looks like a journal.<br>Works like a spreadsheet."
  tabs:
    - label: "Ledger"
      active: true
    - label: "Stats"
      active: false
    - label: "Map"
      active: false
  stats:
    - label: "Total Spent"
      value: "$1,247"
    - label: "Days on Road"
      value: "14"
    - label: "Avg / Day"
      value: "$89"
    - label: "Top Category"
