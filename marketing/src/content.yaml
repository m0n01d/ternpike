meta:
  title: "Ternpike — Track Every Turn of the Road"
  description: "Snap a photo of your receipt at camp. Ternpike reads it, logs your GPS, and shows exactly where your budget stands before you pull out tomorrow morning."
  lang: "en"

brand:
  name: "Ternpike"
  namePrefix: "Tern"
  nameSuffix: "pike"
  tagline: "Track every turn of the road."

nav:
  links:
    - label: "How it works"
      href: "#how"
    - label: "Pricing"
      href: "#pricing"
    - label: "Open Source"
      href: "#oss"
  cta:
    label: "Get Started"
    href: "#signup"

hero:
  headline:
    lines:
      - "Know where your money went"
      - "before you break camp."
  sub:
    - "Ternpike is a trip expense tracker built for life on the road."
    - "Snap a receipt at camp. Your budget updates instantly."
    - "No spreadsheets. No subscription. Your data stays yours."
  actions:
    - kind: "primary"
      label: "Start for free"
      arrow: true
      href: "#signup"
    - kind: "ghost"
      label: "See how it works"
      href: "#how"
  proof: "Built on the Alaska Highway. Used in the real world."

howItWorks:
  eyebrow: "How it works"
  headlineHtml: "Three steps.<br>Then get some sleep."
  steps:
    - number: "01"
      icon: "📸"
      title: "Snap your receipts"
      body: "Photograph one receipt or a stack at the end of the day. Ternpike reads them and pulls out the amount, merchant, category, and a note about what you bought."
    - number: "02"
      icon: "📍"
      title: "Log your location"
      body: "Every expense gets a GPS pin. From the photo itself, your current location, or a map you drop manually. Your route builds itself as you go."
    - number: "03"
      icon: "✅"
      title: "See the full picture"
      body: "Open the ledger. See what you've spent, by day and by category. Know your daily average before you decide whether to splurge on a cabin or sleep in the truck."

features:
  eyebrow: "Features"
  headlineHtml: "Built for the realities of remote travel."
  items:
    - icon: "📶"
      title: "Offline first"
      body: "Ternpike is an installable web app. Queue receipts in the backcountry. Sync when you hit signal. Your cached ledger is always viewable, even with no bars."
    - icon: "🧾"
      title: "Receipt scanning"
      body: "Photograph the receipt. The app reads the amount, merchant, date, and category. You review and confirm. Edit anything before it lands in the ledger."
    - icon: "🗺️"
      title: "GPS trail"
      body: "Every expense with coordinates plots on a live map. Your financial trail and your geographic trail in one view. Useful months later when you can't remember where that cabin was."
    - icon: "📄"
      title: "Your data, your spreadsheet"
      body: "Export the whole trip to a Google Sheet or CSV in a tap. Run your own formulas. Connect to whatever dashboard you like. Ternpike is a UI on top of your data, not a silo."
    - icon: "👥"
      title: "Shared ledger (Nest)"
      body: "Add a travel partner to the same trip. Both phones write to one ledger in real time. No more reconciling who paid for the fuel three days ago."
    - icon: "📊"
      title: "Stats that matter"
      body: "Daily spend. Category breakdown. Cumulative curve. Average per day. The numbers you actually look at when you're deciding whether to drive on or pull over."

ledgerPreview:
  sectionLabel: "The ledger"
  headline: "Looks like a journal.\nWorks like a spreadsheet."
  caption: "Every expense logged, categorized, and mapped. Grouped by day so the story of your trip reads like a trip, not an accounting report."
  totalLabel: "Running total"
  totalAmount: "$39989.00"
  totalMeta: "744 entries · 181 days"
  ledgerSample:
    - day: 181
      date: "May 21, 2026"
      entries:
        - merchant: "ice cream"
          category: "food"
          amount: "$2.00"
          hasGps: true
        - merchant: "Centolla King Crab Shack"
          category: "food"
          amount: "$48.00"
          hasGps: true
    - day: 180
      date: "May 20, 2026"
      entries:
        - merchant: "Aerolíneas Argentinas USH → EZE → LAX"
          category: "transport"
          amount: "$1850.00"
          hasGps: true
        - merchant: "La Anónima Supermarket"
          category: "food"
          amount: "$36.40"
          hasGps: true
    - day: 179
      date: "May 19, 2026"
      entries:
        - merchant: "Hostería Tierra del Fuego"
          category: "lodging"
          amount: "$92.00"
          hasGps: true
        - merchant: "YPF Ruta 3 Sur"
          category: "fuel"
          amount: "$64.10"
          hasGps: true
        - merchant: "Parque Nacional entry"
          category: "activities"
          amount: "$18.00"
          hasGps: false

pricing:
  sectionLabel: "Pricing"
  headline: "Simple.\nNo surprises."
  finePrint: "No trials that turn into surprise charges. No features hidden behind enterprise plans. Fledgling is genuinely free, forever."
  tiers:
    - id: "fledgling"
      name: "Fledgling"
      tagline: "For casual loggers."
      price: "$0"
      priceNote: "always free"
      featured: false
      features:
        - "Offline expense log"
        - "Unlimited trips"
        - "5 receipt scans per month (amount and category only)"
        - "Works on any device"
        - "No account required"
      cta:
        label: "Download free"
        href: "#signup"
        style: "ghost"
        arrow: false
    - id: "fly"
      name: "Fly"
      tagline: "For the dedicated road tripper."
      price: "$2.99 / month"
      priceNote: "$24 / year. Save $12."
      featured: true
      badge: "Recommended"
      features:
        - "Everything in Fledgling"
        - "Unlimited receipt scanning"
        - "Full receipt extraction (merchant, date, notes, GPS)"
        - "Cross-device sync"
        - "Nest. Shared ledger for couples and travel groups."
        - "Stats dashboard"
        - "CSV export"
      cta:
        label: "Start flying"
        href: "#signup"
        style: "primary"
        arrow: true
    - id: "trailblazer"
      name: "Trailblazer"
      tagline: "Own it forever."
      price: "$79"
      priceNote: "one time. First 500 only."
      featured: false
      features:
