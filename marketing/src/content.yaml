      entries:
        - category: "⛽"
          merchant: "Petro-Canada — Alaska Hwy"
          note: "Fill-up before long stretch to Watson Lake"
          amount: "$67.40"
          dim: false
        - category: "🍔"
          merchant: "Tim Hortons, Whitehorse"
          note: "Double double, breakfast sandwich"
          amount: "$11.20"
          dim: false
        - category: "⛺"
          merchant: "Yukon River Camp"
          note: "Tenting, no hookups — beautiful spot"
          amount: "$24.00"
          dim: false
    - heading: "Aug 1, 2026 · Watson Lake, YT · $98.30"
      entries:
        - category: "⛽"
          merchant: "Shell — Watson Lake"
          note: "Pricey but no choice, next station 220mi"
          amount: "$74.30"
          dim: true

