          text: "No receipt scanning"
        - icon: "❌"
          text: "No GPS logging"
        - icon: "❌"
          text: "Your data in their servers"
        - icon: "❌"
          text: "Monthly subscription required"
    - kind: "us"
      heading: "Ternpike"
      rows:
        - icon: "✅"
          text: "Reads receipts automatically"
        - icon: "✅"
          text: "GPS pin on every expense"
        - icon: "✅"
          text: "Your data, your export"
        - icon: "✅"
          text: "Free tier that's actually free"

