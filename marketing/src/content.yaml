meta:
  title: "Ternpike — Track Every Turn of the Road"
  description: "Snap a photo of your receipt at camp. Ternpike reads it, logs your GPS, and shows exactly where your budget stands before you pull out tomorrow morning."
  lang: "en"

brand:
  name: "Ternpike"
  namePrefix: "Tern"
  nameSuffix: "pike"
  tagline: "Track every turn of the road."

nav:
  links:
    - label: "How it works"
      href: "#how"
    - label: "Features"
      href: "#features"
    - label: "Open Source"
      href: "#oss"
  cta:
    label: "Get Early Access"
    href: "#signup"

hero:
  eyebrow: "Road Trip Expense Tracker"
  headline:
    prefix: "Tern"
    suffix: "pike"
  sub: "Snap a photo of your receipt at camp. We read it, log your GPS, and show exactly where your budget stands before you pull out tomorrow morning."
  actions:
    - kind: "primary"
      label: "Get Early Access →"
      href: "#signup"
    - kind: "ghost"
      label: "See How It Works"
      href: "#how"
  proof: "Built on the Alaska Highway · Zero subscription · Your data, your Google Sheet"

howItWorks:
  eyebrow: "How it works"
  headlineHtml: "Three steps.<br>Then get some sleep."
  steps:
    - number: "01"
      icon: "📸"
      title: "Snap your receipts"
      body: "Photograph one receipt or a stack at the end of the day. Ternpike reads them and pulls out the amount, merchant, category, and a note about what you bought."
    - number: "02"
      icon: "📍"
      title: "Log your location"
      body: "Every expense gets a GPS pin. From the photo itself, your current location, or a map you drop manually. Your route builds itself as you go."
    - number: "03"
      icon: "✅"
      title: "See the full picture"
      body: "Open the ledger. See what you've spent, by day and by category. Know your daily average before you decide whether to splurge on a cabin or sleep in the truck."

features:
  eyebrow: "Features"
  headlineHtml: "Built for the realities of remote travel."
  items:
    - icon: "📶"
      title: "Offline first"
      body: "Ternpike is an installable web app. Queue receipts in the backcountry. Sync when you hit signal. Your cached ledger is always viewable, even with no bars."
    - icon: "🧾"
      title: "Receipt scanning"
      body: "Photograph the receipt. The app reads the amount, merchant, date, and category. You review and confirm. Edit anything before it lands in the ledger."
    - icon: "🗺️"
      title: "GPS trail"
      body: "Every expense with coordinates plots on a live map. Your financial trail and your geographic trail in one view. Useful months later when you can't remember where that cabin was."
    - icon: "📄"
      title: "Your data, your spreadsheet"
      body: "Export the whole trip to a Google Sheet or CSV in a tap. Run your own formulas. Connect to whatever dashboard you like. Ternpike is a UI on top of your data, not a silo."
    - icon: "👥"
      title: "Shared ledger (Nest)"
      body: "Add a travel partner to the same trip. Both phones write to one ledger in real time. No more reconciling who paid for the fuel three days ago."
    - icon: "📊"
      title: "Stats that matter"
      body: "Daily spend. Category breakdown. Cumulative curve. Average per day. The numbers you actually look at when you're deciding whether to drive on or pull over."

ledgerPreview:
  eyebrow: "The Ledger"
  headlineHtml: "Looks like a journal.<br>Works like a spreadsheet."
  tabs:
    - label: "Ledger"
      active: true
    - label: "Stats"
