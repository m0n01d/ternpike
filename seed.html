// ── Helpers ─────────────────────────────────────────────────────────────────

let seq = 0
function makeId(prefix, date) {
  const iso = new Date(date).toISOString()
  const rand = (Date.now() + seq++).toString(36).slice(-8).padStart(8, '0')
  return `${prefix}::${iso}::${rand}`
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)] }
function maybePick(arr, prob = 0.6) { return Math.random() < prob ? pick(arr) : '' }

function interpolateWaypoint(waypoints, dayIndex, totalDays) {
  const t = dayIndex / Math.max(totalDays - 1, 1)
  const rawIdx = t * (waypoints.length - 1)
  const i = Math.min(Math.floor(rawIdx), waypoints.length - 2)
  const f = rawIdx - i
  const [lat1, lon1] = waypoints[i]
  const [lat2, lon2] = waypoints[i + 1]
  const jitter = () => (Math.random() - 0.5) * 0.05
  return [lat1 + (lat2 - lat1) * f + jitter(), lon1 + (lon2 - lon1) * f + jitter()]
}

function dateRange(startStr, endStr) {
  const dates = []
  const cur = new Date(startStr)
  const end = new Date(endStr)
  while (cur <= end) {
    dates.push(cur.toISOString().slice(0, 10))
    cur.setDate(cur.getDate() + 1)
  }
  return dates
}

function mkExp(tripId, date, cat, merchant, amount, note, extra = {}) {
  return {
    _id: makeId('expense', date), type: 'expense', tripId,
    amount, category: cat, date, merchant, note: note || '', longNote: '',
    createdAt: new Date(date).toISOString(), lat: null, lon: null, ...extra,
  }
}

function dailyExpenses(dateStr, dayIndex, totalDays, tripId, waypoints) {
  const docs = []
  const [lat, lon] = interpolateWaypoint(waypoints, dayIndex, totalDays)
  const e = (cat, ov = {}) => ({
    _id: makeId('expense', dateStr), type: 'expense', tripId,
    amount: pick(AMOUNTS[cat]), category: cat, date: dateStr,
    merchant: pick(MERCHANTS[cat]), note: maybePick(NOTES[cat], 0.5), longNote: '',
    createdAt: new Date(dateStr).toISOString(), lat, lon, ...ov,
  })
  const driving = Math.random() < 0.70
  if (driving && dayIndex % 2 === 0) docs.push(e('fuel'))
  if (Math.random() < 0.50) docs.push(e('food'))
  if (Math.random() < 0.80) docs.push(e('food'))
  if (Math.random() < 0.90) docs.push(e('food'))
  const r = Math.random()
  if (r < 0.40) docs.push(e('camp'))
  else if (r < 0.90) docs.push(e('lodging'))
  if (dayIndex % 3 === 1 && Math.random() < 0.65) docs.push(e('activities'))
  if (dayIndex % 5 === 2 && Math.random() < 0.70) docs.push(e('parks'))
  if (dayIndex % 4 === 0 && Math.random() < 0.60) docs.push(e('shopping'))
  if (Math.random() < 0.20) docs.push(e('misc'))
  if (Math.random() < 0.08) docs.push(e('gear'))
  if (Math.random() < 0.04) docs.push(e('medical'))
  if (dayIndex === 5 || dayIndex === 22 || dayIndex === 38) docs.push(e('ferry'))
  return docs
}

function getPanAmRegion(dayIndex) {
  if (dayIndex < 21)  return 'arctic'
  if (dayIndex < 42)  return 'pnw'
  if (dayIndex < 67)  return 'mexico'
  if (dayIndex < 101) return 'centralamerica'
  if (dayIndex < 131) return 'southamerica_north'
  if (dayIndex < 162) return 'southamerica_south'
  return 'patagonia'
}

function dailyExpensesPanAm(dateStr, dayIndex, totalDays, tripId) {
  const docs = []
  const [lat, lon] = interpolateWaypoint(TRIP3_WAYPOINTS, dayIndex, totalDays)
  const rd = REGION_DATA[getPanAmRegion(dayIndex)]
  const e = (cat, merchant, amount, note) => ({
    _id: makeId('expense', dateStr), type: 'expense', tripId, amount, category: cat,
    date: dateStr, merchant, note: note || '', longNote: '',
    createdAt: new Date(dateStr).toISOString(), lat, lon,
  })
  const setpieces = PANAMERICAN_SETPIECES[dayIndex] || []
  for (const sp of setpieces) docs.push(e(sp.category, sp.merchant, sp.amount, sp.note))
  if (setpieces.length >= 3) return docs
  if (Math.random() < 0.65 && dayIndex % 2 === 0) docs.push(e('fuel', pick(rd.fuel.m), pick(rd.fuel.a), maybePick(rd.fuel.n, 0.4)))
  if (Math.random() < 0.45) docs.push(e('food', pick(rd.food.m), pick(rd.food.a), maybePick(rd.food.n, 0.5)))
  if (Math.random() < 0.82) docs.push(e('food', pick(rd.food.m), pick(rd.food.a), maybePick(rd.food.n, 0.4)))
  if (Math.random() < 0.90) docs.push(e('food', pick(rd.food.m), pick(rd.food.a), maybePick(rd.food.n, 0.5)))
  const r = Math.random()
  if (r < 0.38) docs.push(e('camp', pick(rd.camp.m), pick(rd.camp.a), maybePick(rd.camp.n, 0.6)))
  else if (r < 0.88) docs.push(e('lodging', pick(rd.lodging.m), pick(rd.lodging.a), maybePick(rd.lodging.n, 0.5)))
  if (dayIndex % 3 === 1 && Math.random() < 0.58) docs.push(e('activities', pick(rd.activities.m), pick(rd.activities.a), maybePick(rd.activities.n, 0.65)))
  if (dayIndex % 4 === 0 && Math.random() < 0.50) docs.push(e('shopping', pick(MERCHANTS.shopping), pick(AMOUNTS.shopping), maybePick(NOTES.shopping, 0.4)))
  if (Math.random() < 0.18) docs.push(e('misc', pick(MERCHANTS.misc), pick(AMOUNTS.misc), maybePick(NOTES.misc, 0.4)))
  if (Math.random() < 0.06) docs.push(e('gear', pick(MERCHANTS.gear), pick(AMOUNTS.gear), maybePick(NOTES.gear, 0.4)))
  if (Math.random() < 0.05) docs.push(e('medical', pick(MERCHANTS.medical), pick(AMOUNTS.medical), maybePick(NOTES.medical, 0.4)))
  return docs
}
