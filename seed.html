// ── ID helpers ──────────────────────────────────────────────────────────────

let seq = 0
function makeId(prefix, date) {
  const iso = new Date(date).toISOString()
  const rand = (Date.now() + seq++).toString(36).slice(-8).padStart(8, '0')
  return `${prefix}::${iso}::${rand}`
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)] }
function maybePick(arr, prob = 0.6) { return Math.random() < prob ? pick(arr) : '' }

function interpolateWaypoint(waypoints, dayIndex, totalDays) {
  const t = dayIndex / Math.max(totalDays - 1, 1)
  const rawIdx = t * (waypoints.length - 1)
  const i = Math.min(Math.floor(rawIdx), waypoints.length - 2)
  const f = rawIdx - i
  const [lat1, lon1] = waypoints[i]
  const [lat2, lon2] = waypoints[i + 1]
  const jitter = () => (Math.random() - 0.5) * 0.05
  return [lat1 + (lat2 - lat1) * f + jitter(), lon1 + (lon2 - lon1) * f + jitter()]
}

function dateRange(startStr, endStr) {
  const dates = []
  const cur = new Date(startStr)
  const end = new Date(endStr)
  while (cur <= end) {
    dates.push(cur.toISOString().slice(0, 10))
    cur.setDate(cur.getDate() + 1)
  }
  return dates
}

// ── Trips 1 & 2 daily generator ─────────────────────────────────────────────

function dailyExpenses(dateStr, dayIndex, totalDays, tripId, waypoints) {
  const docs = []
  const [lat, lon] = interpolateWaypoint(waypoints, dayIndex, totalDays)

  function expense(cat, overrides = {}) {
    return {
      _id:       makeId('expense', dateStr),
      type:      'expense',
      tripId,
      amount:    pick(AMOUNTS[cat]),
      category:  cat,
      date:      dateStr,
      merchant:  pick(MERCHANTS[cat]),
      note:      maybePick(NOTES[cat], 0.5),
      longNote:  '',
      createdAt: new Date(dateStr).toISOString(),
      lat, lon,
      ...overrides,
    }
  }

  const driving = Math.random() < 0.70
  if (driving && dayIndex % 2 === 0) docs.push(expense('fuel'))
  if (Math.random() < 0.50) docs.push(expense('food'))
  if (Math.random() < 0.80) docs.push(expense('food'))
  if (Math.random() < 0.90) docs.push(expense('food'))
  const r = Math.random()
  if (r < 0.40) docs.push(expense('camp'))
  else if (r < 0.90) docs.push(expense('lodging'))
  if (dayIndex % 3 === 1 && Math.random() < 0.65) docs.push(expense('activities'))
  if (dayIndex % 5 === 2 && Math.random() < 0.70) docs.push(expense('parks'))
  if (dayIndex % 4 === 0 && Math.random() < 0.60) docs.push(expense('shopping'))
  if (Math.random() < 0.20) docs.push(expense('misc'))
  if (Math.random() < 0.08) docs.push(expense('gear'))
  if (Math.random() < 0.04) docs.push(expense('medical'))
  if (dayIndex === 5 || dayIndex === 22 || dayIndex === 38) docs.push(expense('ferry'))
  return docs
}

function getPanAmRegion(dayIndex) {
  if (dayIndex < 21)  return 'arctic'
  if (dayIndex < 42)  return 'pnw'
  if (dayIndex < 67)  return 'mexico'
  if (dayIndex < 101) return 'centralamerica'
  if (dayIndex < 131) return 'southamerica_north'
  if (dayIndex < 162) return 'southamerica_south'
  return 'patagonia'
}

function dailyExpensesPanAm(dateStr, dayIndex, totalDays, tripId) {
  const docs = []
  const [lat, lon] = interpolateWaypoint(TRIP3_WAYPOINTS, dayIndex, totalDays)
  const rd = REGION_DATA[getPanAmRegion(dayIndex)]

  function expense(cat, merchant, amount, note) {
    return {
      _id:       makeId('expense', dateStr),
      type:      'expense',
      tripId,
      amount,
      category:  cat,
      date:      dateStr,
      merchant,
      note:      note || '',
      longNote:  '',
      createdAt: new Date(dateStr).toISOString(),
      lat, lon,
    }
  }

  // Setpieces first
  const setpieces = PANAMERICAN_SETPIECES[dayIndex] || []
  for (const sp of setpieces) {
    docs.push(expense(sp.category, sp.merchant, sp.amount, sp.note))
  }

  // Skip routine generation on heavy setpiece days
  if (setpieces.length >= 3) return docs

  // Fuel every other driving day
  if (Math.random() < 0.65 && dayIndex % 2 === 0) {
    docs.push(expense('fuel', pick(rd.fuel.m), pick(rd.fuel.a), maybePick(rd.fuel.n, 0.4)))
  }

  // Food: breakfast (45%), lunch (82%), dinner (90%)
  if (Math.random() < 0.45) docs.push(expense('food', pick(rd.food.m), pick(rd.food.a), maybePick(rd.food.n, 0.5)))
  if (Math.random() < 0.82) docs.push(expense('food', pick(rd.food.m), pick(rd.food.a), maybePick(rd.food.n, 0.4)))
  if (Math.random() < 0.90) docs.push(expense('food', pick(rd.food.m), pick(rd.food.a), maybePick(rd.food.n, 0.5)))

  // Overnight
  const r = Math.random()
  if (r < 0.38) {
    docs.push(expense('camp', pick(rd.camp.m), pick(rd.camp.a), maybePick(rd.camp.n, 0.6)))
  } else if (r < 0.88) {
    docs.push(expense('lodging', pick(rd.lodging.m), pick(rd.lodging.a), maybePick(rd.lodging.n, 0.5)))
  }

  // Activities ~every 3rd day
  if (dayIndex % 3 === 1 && Math.random() < 0.58) {
    docs.push(expense('activities', pick(rd.activities.m), pick(rd.activities.a), maybePick(rd.activities.n, 0.65)))
  }

  // Shopping ~every 4th day
  if (dayIndex % 4 === 0 && Math.random() < 0.50) {
    docs.push(expense('shopping', pick(MERCHANTS.shopping), pick(AMOUNTS.shopping), maybePick(NOTES.shopping, 0.4)))
  }

  // Misc
  if (Math.random() < 0.18) {
    docs.push(expense('misc', pick(MERCHANTS.misc), pick(AMOUNTS.misc), maybePick(NOTES.misc, 0.4)))
  }

  // Gear: occasional
  if (Math.random() < 0.06) {
    docs.push(expense('gear', pick(MERCHANTS.gear), pick(AMOUNTS.gear), maybePick(NOTES.gear, 0.4)))
  }

  // Medical: rare
  if (Math.random() < 0.05) {
    docs.push(expense('medical', pick(MERCHANTS.medical), pick(AMOUNTS.medical), maybePick(NOTES.medical, 0.4)))
  }

  return docs
}

// ── Build all docs ───────────────────────────────────────────────────────────

async function seed() {
  log('── Checking existing data ──────────────────────────────────────', 'hdr')
  const existing = await db.allDocs()
  if (existing.rows.length > 0) {
    log(`Found ${existing.rows.length} existing docs. Will skip conflicts.`, 'ok')
  } else {
    log('Database is empty — seeding from scratch.', 'ok')
  }

  const allDocs = []

  // ── Trip 1: Alaska Highway Adventure ─────────────────────────────────────
  log('\n── Trip 1: Alaska Highway Adventure ─────────────────────────────', 'hdr')
  const trip1Start = '2026-03-15', trip1End = '2026-04-27'
  const trip1Id = makeId('trip', trip1Start)
  allDocs.push({ _id: trip1Id, type: 'trip', budget: 8500, coverPhotoUrl: '',
    description: 'Full run of the Alaska Highway from Dawson Creek to Anchorage, with side trips to Denali and Homer.',
    endDate: trip1End, name: 'Alaska Highway Adventure', startDate: trip1Start })
  const trip1Dates = dateRange(trip1Start, trip1End)
  log(`Generating expenses for ${trip1Dates.length} days...`)
  for (let i = 0; i < trip1Dates.length; i++) {
    allDocs.push(...dailyExpenses(trip1Dates[i], i, trip1Dates.length, trip1Id, TRIP1_WAYPOINTS))
  }

  // ── Trip 2: Pacific Northwest Coastal Loop ────────────────────────────────
  log('\n── Trip 2: Pacific Northwest Coastal Loop ────────────────────────', 'hdr')
  const trip2Start = '2026-04-28', trip2End = '2026-05-19'
  const trip2Id = makeId('trip', trip2Start)
  allDocs.push({ _id: trip2Id, type: 'trip', budget: 4200, coverPhotoUrl: '',
    description: 'Seattle south to San Francisco along Highway 101, then back north through the Cascades.',
    endDate: trip2End, name: 'Pacific Northwest Coastal Loop', startDate: trip2Start })
  const trip2Dates = dateRange(trip2Start, trip2End)
  log(`Generating expenses for ${trip2Dates.length} days...`)
  for (let i = 0; i < trip2Dates.length; i++) {
    allDocs.push(...dailyExpenses(trip2Dates[i], i, trip2Dates.length, trip2Id, TRIP2_WAYPOINTS))
  }

  // ── Trip 3: Pan-American Highway ──────────────────────────────────────────
  log('\n── Trip 3: Pan-American: Prudhoe Bay → Ushuaia ──────────────────', 'hdr')
  const trip3Start = '2025-09-01', trip3End = '2026-02-28'
  const trip3Id = makeId('trip', trip3Start)
  allDocs.push({ _id: trip3Id, type: 'trip', budget: 28000, coverPhotoUrl: '',
    description: 'Full Pan-American Highway from Prudhoe Bay, Alaska to Ushuaia, Argentina. 17 countries, 181 days, ~28,000 miles. The whole thing.',
    endDate: trip3End, name: 'Pan-American: Prudhoe Bay → Ushuaia', startDate: trip3Start })
  const trip3Dates = dateRange(trip3Start, trip3End)
  log(`Generating expenses for ${trip3Dates.length} days...`)
  for (let i = 0; i < trip3Dates.length; i++) {
    allDocs.push(...dailyExpensesPanAm(trip3Dates[i], i, trip3Dates.length, trip3Id))
  }

  // ── Amendments ────────────────────────────────────────────────────────────
  const expenseDocs = allDocs.filter(d => d.type === 'expense')
  for (const idx of [3, 10, 25, 60, 90, 200, 350]) {
    const target = expenseDocs[idx]
    if (!target) continue
    allDocs.push({ _id: makeId('amend', target.date), type: 'amend', targetId: target._id,
      createdAt: new Date(target.date + 'T12:00:00Z').toISOString(), amount: target.amount + 5, note: 'Corrected amount' })
  }

  // ── Voids ─────────────────────────────────────────────────────────────────
  for (const idx of [7, 40, 75, 150]) {
    const target = expenseDocs[idx]
    if (!target) continue
    allDocs.push({ _id: `void::${target._id}::del`, type: 'void', targetId: target._id,
      createdAt: new Date(target.date + 'T12:00:00Z').toISOString() })
  }

  log(`\nTotal documents to insert: ${allDocs.length}`)

  // ── Bulk insert ───────────────────────────────────────────────────────────
  let inserted = 0, skipped = 0, errors = 0
  const BATCH = 100
  for (let i = 0; i < allDocs.length; i += BATCH) {
    const result = await db.bulkDocs(allDocs.slice(i, i + BATCH))
    for (const r of result) {
      if (r.ok)                  inserted++
      else if (r.status === 409) skipped++
      else { errors++; log(`  Error: ${r.message}`, 'err') }
    }
    log(`  ${Math.min(i + BATCH, allDocs.length)} / ${allDocs.length}`)
  }

  log(`\n✓ Inserted: ${inserted}  Skipped: ${skipped}  Errors: ${errors}`, 'ok')

  const types = {}, cats = {}
  for (const d of allDocs) types[d.type] = (types[d.type] || 0) + 1
  for (const d of allDocs.filter(d => d.type === 'expense')) cats[d.category] = (cats[d.category] || 0) + 1
  log('\nBy type:')
  for (const [t, n] of Object.entries(types)) log(`  ${t.padEnd(10)} ${n}`)
  log('\nBy category:')
  for (const [c, n] of Object.entries(cats).sort((a,b) => b[1]-a[1])) log(`  ${c.padEnd(14)} ${n}`)

  document.getElementById('done').style.display = 'block'
}

seed().catch(err => log('Fatal: ' + err, 'err'))
</script>
