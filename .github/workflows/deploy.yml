name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Elm
        run: npm install -g elm

      - name: Build (optimized)
        run: elm make src/Main.elm --output=main.js --optimize

      - name: Stamp build hash into service worker
        run: sed -i "s/alaska-v1/alaska-${{ github.sha }}/g" sw.js

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          clean-exclude: |
            .git
            .github
            elm-stuff
