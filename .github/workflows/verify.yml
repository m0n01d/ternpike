name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure:
    name: Pure tier (elm-test + review + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run tests
        run: npm test
      - name: elm-review
        run: npm run review
      - name: Check formatting
        run: npm run format:check

  dom:
    name: DOM tier (backend-free /verify probes)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run DOM tier
        run: npm run verify:dom
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-dom-report
          path: e2e/.results-verify
          retention-days: 14
