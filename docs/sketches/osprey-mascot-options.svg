<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #faf7f0; }
      .panel { fill: #f2ede3; stroke: #d4c9a8; stroke-width: 2; }
      .bird { fill: #2d3a22; }
      .accent { fill: #b85c38; }
      .label { fill: #1e2818; font-size: 22px; font-weight: 700; text-anchor: middle; }
      .sub { fill: #6b7c58; font-size: 13px; text-anchor: middle; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
      .title { fill: #1e2818; font-size: 18px; font-weight: 700; }
      .note { fill: #6b7c58; font-size: 12px; }
    </style>
  </defs>

  <rect class="bg" width="1300" height="620"/>

  <text class="title" x="40" y="40">Osprey mascot — bird sketches per tier</text>
  <text class="note"  x="40" y="62">Flat silhouettes, brand forest + rust accent. Trailblazer has three candidates — pick one.</text>

  <!-- ============ TERN (free) ============ -->
  <g transform="translate(60,110)">
    <rect class="panel" x="0" y="0" width="200" height="200" rx="12"/>
    <!-- Common Tern: top-down flying silhouette — symmetric, forked tail -->
    <g transform="translate(100,100)">
      <!-- Body: head at top, tapering down -->
      <path class="bird" d="
        M -6 -45
        Q -8 -20 -7 20
        L  0 35
        L  7 20
        Q  8 -20 6 -45
        Q  0 -55 -6 -45 Z"/>
      <!-- Pointed beak -->
      <path class="accent" d="M -2 -55 L 0 -68 L 2 -55 Z"/>
      <!-- Black cap -->
      <path d="M -6 -48 Q 0 -56 6 -48 L 5 -38 Q 0 -42 -5 -38 Z" fill="#1a2412"/>
      <!-- Eye dot -->
      <circle fill="#faf7f0" cx="-3" cy="-46" r="1"/>
      <!-- Wings: long, narrow, sharply pointed, swept back -->
      <path class="bird" d="
        M -7 -25
        L -78 10
        L -55 0
        L -10 -10 Z"/>
      <path class="bird" d="
        M  7 -25
        L  78 10
        L  55 0
        L  10 -10 Z"/>
      <!-- Forked tail -->
      <path class="bird" d="
        M -6 25
        L -14 55
        L  0 42
        L  14 55
        L  6 25 Z"/>
    </g>
    <text class="label" x="100" y="232">Tern</text>
    <text class="sub"   x="100" y="252">Free</text>
  </g>

  <!-- ============ OSPREY (paid) ============ -->
  <g transform="translate(290,110)">
    <rect class="panel" x="0" y="0" width="200" height="200" rx="12"/>
    <!-- Osprey: spread wings with crook ("M"), fish in talons -->
    <g transform="translate(100,90)">
      <!-- Wings (bent M, signature osprey crook) -->
      <path class="bird" d="
        M -90 10
        L -55 -25
        L -30 -10
        L -10 -30
        L  0 -20
        L  10 -30
        L  30 -10
        L  55 -25
        L  90 10
        L  60 0
        L  30 5
        L  10 -2
        L -10 -2
        L -30 5
        L -60 0 Z"/>
      <!-- Body -->
      <ellipse class="bird" cx="0" cy="0" rx="10" ry="18"/>
      <!-- Head + beak -->
      <circle class="bird" cx="0" cy="-22" r="8"/>
      <path class="bird" d="M -2 -16 L 0 -10 L 2 -16 Z"/>
      <!-- White face mask / brow -->
      <path d="M -7 -24 Q 0 -28 7 -24 L 5 -20 Q 0 -22 -5 -20 Z" fill="#f2ede3"/>
      <!-- Legs + fish -->
      <line x1="-4" y1="16" x2="-6" y2="32" stroke="#2d3a22" stroke-width="2"/>
      <line x1="4"  y1="16" x2="6"  y2="32" stroke="#2d3a22" stroke-width="2"/>
      <!-- Fish (rust accent), held head-first -->
      <g transform="translate(0,40)">
        <ellipse class="accent" cx="0" cy="0" rx="22" ry="6"/>
        <path class="accent" d="M 22 0 L 32 -6 L 32 6 Z"/>
        <circle fill="#faf7f0" cx="-12" cy="-1" r="1.5"/>
      </g>
    </g>
    <text class="label" x="100" y="232">Osprey</text>
    <text class="sub"   x="100" y="252">Paid · $2.99/mo</text>
  </g>

  <!-- ============ TRAILBLAZER OPTION A — PEREGRINE (horizontal flight) ============ -->
  <g transform="translate(520,110)">
    <rect class="panel" x="0" y="0" width="200" height="200" rx="12"/>
    <g transform="translate(100,100)">
      <!-- Peregrine in fast horizontal flight, swept-back wings, head right -->
      <!-- Body -->
      <ellipse class="bird" cx="-5" cy="0" rx="38" ry="11"/>
      <!-- Tail -->
      <path class="bird" d="M -38 -7 L -60 -5 L -60 5 L -38 7 Z"/>
      <!-- Head -->
      <circle class="bird" cx="28" cy="-3" r="11"/>
      <!-- Sharp beak with hook -->
      <path class="bird" d="M 38 -4 L 52 -1 L 50 2 L 38 2 Z"/>
      <!-- Dark cap (peregrine's signature "helmet") -->
      <path d="M 22 -12 Q 30 -16 38 -10 L 34 -3 Q 28 -5 22 -3 Z" fill="#1a2412"/>
      <!-- Eye -->
      <circle fill="#faf7f0" cx="30" cy="-6" r="1.5"/>
      <!-- Wings: swept back, scimitar-shape (the falcon signature) -->
      <path class="bird" d="
        M -5 -8
        L -55 -55
        L -30 -38
        L -10 -18 Z"/>
      <path class="bird" d="
        M -5 8
        L -55 55
        L -30 38
        L -10 18 Z"/>
      <!-- Speed lines (rust) behind tail -->
      <line x1="-65" y1="-12" x2="-82" y2="-18" stroke="#b85c38" stroke-width="3" stroke-linecap="round"/>
      <line x1="-65" y1="0"   x2="-85" y2="0"   stroke="#b85c38" stroke-width="3" stroke-linecap="round"/>
      <line x1="-65" y1="12"  x2="-82" y2="18"  stroke="#b85c38" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text class="label" x="100" y="232">Peregrine</text>
    <text class="sub"   x="100" y="252">Trailblazer · option A</text>
  </g>

  <!-- ============ TRAILBLAZER OPTION B — ALBATROSS (glide) ============ -->
  <g transform="translate(750,110)">
    <rect class="panel" x="0" y="0" width="200" height="200" rx="12"/>
    <g transform="translate(100,100)">
      <!-- Albatross: extremely long thin wings, gliding flat -->
      <path class="bird" d="
        M -95 5
        Q -60 -10 -20 -3
        L 0 -8
        L 20 -3
        Q 60 -10 95 5
        L 80 12
        Q 50 5 20 8
        L 0 4
        L -20 8
        Q -50 5 -80 12 Z"/>
      <!-- Body -->
      <ellipse class="bird" cx="0" cy="0" rx="6" ry="10"/>
      <!-- Head + beak (forward-facing) -->
      <circle class="bird" cx="0" cy="-12" r="5"/>
      <path class="accent" d="M -1 -10 L 0 -4 L 1 -10 Z"/>
      <!-- Wingtip "fingers" -->
      <line x1="-95" y1="5" x2="-100" y2="0"  stroke="#2d3a22" stroke-width="2"/>
      <line x1="95"  y1="5" x2="100"  y2="0"  stroke="#2d3a22" stroke-width="2"/>
    </g>
    <text class="label" x="100" y="232">Albatross</text>
    <text class="sub"   x="100" y="252">Trailblazer · option B</text>
  </g>

  <!-- ============ TRAILBLAZER OPTION C — EAGLE (heraldic) ============ -->
  <g transform="translate(980,110)">
    <rect class="panel" x="0" y="0" width="200" height="200" rx="12"/>
    <g transform="translate(100,100)">
      <!-- Bald eagle, spread-wing heraldic pose -->
      <!-- Wings up + out -->
      <path class="bird" d="
        M 0 -10
        L -25 -50
        L -50 -60
        L -75 -45
        L -85 -20
        L -70 -10
        L -45 -20
        L -20 -5
        L -10 0 Z"/>
      <path class="bird" d="
        M 0 -10
        L 25 -50
        L 50 -60
        L 75 -45
        L 85 -20
        L 70 -10
        L 45 -20
        L 20 -5
        L 10 0 Z"/>
      <!-- Body -->
      <path class="bird" d="
        M -10 0
        Q -15 25 -8 50
        L 0 60
        L 8 50
        Q 15 25 10 0 Z"/>
      <!-- Tail fan -->
      <path class="bird" d="
        M -12 45
        L -18 70
        L 0 65
        L 18 70
        L 12 45 Z"/>
      <!-- Head (white) -->
      <circle fill="#f2ede3" stroke="#2d3a22" stroke-width="2" cx="0" cy="-15" r="10"/>
      <!-- Beak (rust/gold accent) -->
      <path class="accent" d="M -2 -10 L 2 -10 L 0 -2 Z"/>
      <!-- Eye -->
      <circle fill="#1a2412" cx="3" cy="-17" r="1.5"/>
    </g>
    <text class="label" x="100" y="232">Eagle</text>
    <text class="sub"   x="100" y="252">Trailblazer · option C</text>
  </g>

  <!-- Footer notes -->
  <g transform="translate(60,420)">
    <text class="title" x="0" y="0">Tradeoffs</text>
    <text class="note" x="0" y="24"><tspan font-weight="700" fill="#2d3a22">Peregrine</tspan> — apex predator, fastest bird alive. Action-y, signals "power user". Strongest visual at favicon size (it's a single shape).</text>
    <text class="note" x="0" y="44"><tspan font-weight="700" fill="#2d3a22">Albatross</tspan> — master of long-distance travel, the truest "trailblazer" by behavior. Reads quieter; the wide wings may not scale to 16px.</text>
    <text class="note" x="0" y="64"><tspan font-weight="700" fill="#2d3a22">Eagle</tspan> — heraldic, premium feel, fits a "founders' tier" badge. Risk: clichéd / too American-patriotic depending on execution.</text>
    <text class="note" x="0" y="92" font-style="italic">All three would be rendered as one-color silhouettes in the brand forest, with the rust accent reserved for moments (osprey's fish, peregrine's speed lines).</text>
  </g>
</svg>
