name = "ternpike-auth"
main = "index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "CODES_KV"
id = "a3818441349d4138b8898fac4480bf1a"

# Subscription tier source of truth (server-authoritative — see CLAUDE.md
# "Storage tiers"). Provision with:
#   wrangler kv:namespace create TIERS_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "TIERS_KV"
id = "d95ba1e24a514a6e8a9742cf176a541d"

# Geocode endpoint per-user rate limit. Token bucket stored as JSON
# (`{count, windowStart}`), 100 calls per rolling 60s window. Sized
# for typical batch-scanned road-trip volume (~30-50 receipts) plus
# runaway-loop defense. Provision with:
#   wrangler kv:namespace create GEOCODE_RL_KV
[[kv_namespaces]]
binding = "GEOCODE_RL_KV"
id = "0828b3748638455e964b7120ab0a46a5"

# Geocode result cache (key: `addr:<sha256(normalized)>`, value: JSON
# `{lat, lon}`, TTL: 30d for hits, 1d for no-match). Shared across all
# users — addresses resolve to the same point regardless of who asked.
# Provision with:
#   wrangler kv namespace create GEOCODE_CACHE_KV
[[kv_namespaces]]
binding = "GEOCODE_CACHE_KV"
id = "4a9baf82359545ef981e7dcc6a646f94"

# Per-device push subscriptions + notification prefs for PWA push notifications.
# Schema:
#   push:sub::<userId>::<deviceId>  -> { endpoint, auth, p256dh, createdAt, tierAtSubscribe }
#   push:pref::<userId>::<deviceId> -> { weeklyScanReminder: bool, ... }
# Subscriptions are per-device (a user may opt out on iPad while keeping iPhone on).
# Provision with: wrangler kv namespace create PUSH_KV
[[kv_namespaces]]
binding = "PUSH_KV"
id = "679c582bcded4fef8fdb3cebcb8940cc"

# QR-sticker scan counters (key: `<slug>`, value: JSON `{count, firstAt, lastAt}`).
# Slugs are normalized to `[a-z0-9-]{1,32}`. Sized for ad-hoc growth-hacker
# stickers — a few dozen slugs at most. Bumped via executionCtx.waitUntil on
# every `/qr/:slug` redirect; read by `GET /admin/qr`.
# Provision with: wrangler kv namespace create QR_KV
[[kv_namespaces]]
binding = "QR_KV"
id = "5842530248344e7a996993bc38e99822"

[vars]
COUCH_URL = "https://couch.ternpike.com"
# Resend audience ID for the marketing waitlist. Required path
# parameter for POST /audiences/{id}/contacts — the scoped
# RESEND_WAITLIST_API_KEY does not imply an audience on its own.
RESEND_AUDIENCE_ID = "206e97c4-13b7-4a6a-a85b-01414c35449b"


[[routes]]
pattern = "api.ternpike.com"
custom_domain = true

# Short URL for printed QR stickers — `ternpike.com/qr/<slug>` is denser/easier
# to scan than `api.ternpike.com/qr/<slug>`. Worker route preempts the
# marketing Pages site for `/qr/*` only; everything else under ternpike.com
# still hits Pages.
[[routes]]
pattern = "ternpike.com/qr/*"
zone_name = "ternpike.com"

# Hourly: grace-to-frozen sharedtrip sweep (see server/sharedTrips.js `runGraceFreezeSweep`).
# Friday 17:00 UTC: weekly scan reminder push (see server/notifications.js
# `sendWeeklyScanReminders`); dispatched in scheduled() via event.cron branching.
[triggers]
crons = ["0 * * * *", "0 17 * * 5"]

# Set secrets via: wrangler secret put NAME
#   ADMIN_SECRET          (gates /admin/* — required by the ternpike-admin TUI)
#   ANTHROPIC_API_KEY     (Ternpike-owned key for POST /scan — NEVER committed, NEVER sent to browser)
#   COUCH_ADMIN_PASS
#   COUCH_ADMIN_USER
#   GOOGLE_GEOCODING_API_KEY  (Geocoding API key from the Google Cloud project — see issue #171)
#   RESEND_API_KEY
#   RESEND_WAITLIST_API_KEY  (separate Resend token scoped to the waitlist audience)
#   SERVER_SECRET
#   TIER_WEBHOOK_SECRET   (shared with the future Stripe webhook + test hook)
#   VAPID_PRIVATE_KEY     (base64url; PERMANENT — re-keying invalidates all push subscriptions)
#   VAPID_PUBLIC_KEY      (base64url; also shipped to client as VITE_VAPID_PUBLIC_KEY at build time)
#   VAPID_SUBJECT         (mailto: URL, e.g. mailto:ops@ternpike.com)
