name = "ternpike-auth"
main = "index.js"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "CODES_KV"
id = "a3818441349d4138b8898fac4480bf1a"

# Subscription tier source of truth (server-authoritative — see CLAUDE.md
# "Storage tiers"). Provision with:
#   wrangler kv:namespace create TIERS_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "TIERS_KV"
id = "d95ba1e24a514a6e8a9742cf176a541d"

[vars]
COUCH_URL = "https://couch.ternpike.com"


[[routes]]
pattern = "api.ternpike.com"
custom_domain = true

# Hourly sweep of flocks in `grace` whose 14-day window has elapsed; flips
# them to `frozen`. See server/flocks.js `runGraceFreezeSweep`.
[triggers]
crons = ["0 * * * *"]

# Set secrets via: wrangler secret put NAME
#   COUCH_ADMIN_USER
#   COUCH_ADMIN_PASS
#   SERVER_SECRET
#   RESEND_API_KEY
#   RESEND_WAITLIST_API_KEY  (separate Resend token scoped to the waitlist audience)
#   TIER_WEBHOOK_SECRET   (shared with the future Stripe webhook + test hook)
